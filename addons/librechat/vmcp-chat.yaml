# LibreChat-facing vMCP gateway. Aggregates the same infra-tools backends as
# vmcp-infra, but accepts Keycloak-issued user tokens instead of being
# anonymous — LibreChat forwards the logged-in user's access token on every
# MCP call via `Authorization: Bearer {{LIBRECHAT_OPENID_ACCESS_TOKEN}}`.
#
# Exposed in-cluster only (ClusterIP, no HTTPRoute, no registry-export) —
# this resource is only useful if the LibreChat addon is installed.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: vmcp-chat-oidc
  namespace: mcp-workloads
spec:
  type: inline
  inline:
    issuer: https://$AUTH_HOSTNAME/realms/$KC_REALM
    # Traefik serves the Keycloak hostname with a self-signed cert; mount the
    # CA so the vMCP pod can verify the issuer's TLS.
    caBundleRef:
      configMapRef:
        name: traefik-ca
        key: ca.crt
    # The Keycloak issuer resolves to the Traefik LB (a private RFC1918
    # address in this kind cluster). The vMCP otherwise refuses to fetch
    # OIDC discovery / JWKS from private IPs as an SSRF guard.
    jwksAllowPrivateIP: true
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: vmcp-chat
  namespace: mcp-workloads
spec:
  groupRef:
    name: infra-tools
  telemetryConfigRef:
    name: shared-otel
    serviceName: vmcp-chat-server
  config:
    audit:
      enabled: true
      includeRequestData: true
      includeResponseData: true
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      # Trim the Grafana tools down to only the components present in the demo stack.
      tools:
        - workload: grafana
          filter:
            - "alerting_manage_routing"
            - "alerting_manage_rules"
            - "analyze_loki_labels"
            - "check_datasources_health"
            - "create_folder"
            - "find_error_pattern_logs"
            - "generate_deeplink"
            - "get_alert_group"
            - "get_dashboard_by_uid"
            - "get_dashboard_panel_queries"
            - "get_dashboard_property"
            - "get_dashboard_summary"
            - "get_datasource"
            - "grafana_api_request"
            - "list_alert_groups"
            - "list_datasources"
            - "list_loki_label_names"
            - "list_loki_label_values"
            - "list_prometheus_label_names"
            - "list_prometheus_label_values"
            - "list_prometheus_metric_metadata"
            - "list_prometheus_metric_names"
            - "query_loki_logs"
            - "query_loki_patterns"
            - "query_loki_stats"
            - "query_prometheus"
            - "query_prometheus_histogram"
            - "search_dashboards"
            - "search_folders"
            - "update_dashboard"
            - "update_datasource"
    # Shared with vmcp-platform.
    compositeToolRefs:
      - name: composite-tool-audit-image-supply-chain
      - name: composite-tool-mcp-server-pulse
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: vmcp-chat-oidc
      audience: toolhive-vmcp-chat
      # Without this, the vmcp binary reports the wrong Service name
      # (vmcp-chat instead of vmcp-vmcp-chat) in its Protected Resource
      # Metadata, which strict RFC 9728 clients reject.
      resourceUrl: http://vmcp-vmcp-chat.mcp-workloads.svc.cluster.local:4483/mcp
    # Per-persona tool filtering via Cedar. Policies live in
    # vmcp-chat-authz.yaml, which is easier to read and edit than escaped
    # JSON inlined here. The default key is authz.json, so ours is explicit.
    authzConfig:
      type: configMap
      configMap:
        name: vmcp-chat-authz
        key: authz-config.json
  outgoingAuth:
    source: inline
  serviceType: ClusterIP
