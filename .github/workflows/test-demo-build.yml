name: Demo Environment Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: kind-config.yaml
          cluster_name: toolhive-demo-sandbox
          cloud_provider: true
          version: v0.33.0 # renovate: datasource=github-releases depName=kubernetes-sigs/kind

      - name: Verify cluster is running
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install ToolHive CLI
        uses: StacklokLabs/toolhive-actions/install@0570ceb9fb21c3e1ca0ccb2a62284e1d0762f160 # v0.0.7

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Run bootstrap script
        run: |
          chmod +x bootstrap.sh
          ./bootstrap.sh
        env:
          # Enable debug mode for better CI logging
          DEBUG: "1"

      - name: Run validation script
        run: |
          chmod +x validate.sh
          ./validate.sh
